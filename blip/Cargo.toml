[package]
name = "blip"
description = "Lightweight web tracing tool for embedded systems"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
proto.workspace = true
serde.workspace = true

egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
egui_extras = "0.36.1"
egui_plot = "0.37.0"
egui_tiles = "0.17.1"
egui-phosphor = "0.13.0"

chrono = { version = "0.4", features = ["clock", "std", "wasm-bindgen"] }
ewebsock = "0.8.0"
hex-string = "0.1.0"
log = "0.4"
regex = "1"
serde_cbor_2 = "0.13.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3" # to access the DOM (to hide the loading text)

[lints]
workspace = true
