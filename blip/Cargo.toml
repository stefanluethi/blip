[package]
name = "blip"
description = "Lightweight web tracing tool for embedded systems"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Renders the screenshots of the documentation with wgpu, see src/app/screenshots.rs
# and `make screenshots` in doc/.
screenshots = ["egui_kittest/wgpu", "egui_kittest/eframe"]

[dependencies]
blip-kit = { workspace = true, features = ["workbench"] }
proto.workspace = true
serde.workspace = true

egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
egui-phosphor = "0.13.0"

chrono = { version = "0.4", features = ["clock", "std", "wasm-bindgen"] }
image = { version = "0.25.6", default-features = false, features = ["png"] } # the icon in the menu bar
log = "0.4"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
# to access the DOM (to hide the loading text, to save when the page is hidden, to ask
# before an unsaved recording is left)
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Performance",
    "Url",
    "Window",
] }

[lints]
workspace = true

[dev-dependencies]
blip-kit = { workspace = true, features = ["test-util"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.154"
egui_kittest = "0.36.2"
tungstenite = "0.24.0" # a WebSocket server to connect to, as ewebsock uses natively
