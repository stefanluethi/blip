[package]
name = "blip-kit"
description = "Library of blip, the tracing tool for embedded systems: store, widgets and workbench"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blip-kit"
readme = "README.md"
keywords = ["tracing", "embedded", "egui", "plot", "telemetry"]
categories = ["embedded", "gui", "visualization"]
publish = true
exclude = ["CLAUDE.md"] # for the agents that work here, not for users of the crate

[features]
default = ["widgets", "websocket"]
# The look, the time range with its controls and timeline, and the views, with egui.
widgets = [
    "dep:egui",
    "dep:egui_extras",
    "dep:egui_plot",
    "dep:egui-phosphor",
    "dep:regex",
    "dep:serde_json",
]
# The WebSocket source, to connect to an outpost or a target.
websocket = ["dep:ewebsock"]
# The layout of views the user arranges, the presets, the connections, the toasts and
# the file dialogs.
workbench = [
    "widgets",
    "websocket",
    "dep:egui_tiles",
    "dep:rfd",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# Helpers for the tests of applications built on the library, e.g. selecting a view by
# its name. Not for use outside tests.
test-util = []

[dependencies]
proto.workspace = true
serde.workspace = true

chrono = { version = "0.4", features = ["clock", "std", "wasm-bindgen"] }
flate2 = "1.1.10" # gzip of recordings
log = "0.4"
serde_cbor_2 = "0.13.0"

# websocket:
ewebsock = { version = "0.8.0", optional = true }

# widgets:
egui = { version = "0.36.1", optional = true }
egui_extras = { version = "0.36.1", optional = true }
egui_plot = { version = "0.37.0", optional = true }
egui-phosphor = { version = "0.13.0", optional = true }
# the filter of the log table: without the Unicode tables of scripts, ages and
# properties (\p{Greek}), which make most of its size; \w, \d, \s and matching
# without case stay Unicode
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-case",
    "unicode-perl",
], optional = true }

# workbench:
egui_tiles = { version = "0.17.1", optional = true }
serde_json = { version = "1.0.154", optional = true } # layout files, views of custom types

# workbench, native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17.2", optional = true } # file dialogs

# workbench, web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# to open and download files
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Performance",
    "Url",
    "Window",
], optional = true }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = "0.36.2"
# the window of the example
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tungstenite = "0.24.0" # a WebSocket server to connect to, as ewebsock uses natively

# the example in the browser
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

# the dashboard built in code, see examples/dashboard.rs
[[example]]
name = "dashboard"
required-features = ["widgets"]
test = true

# the baseline measurements of the store and the plot, see tests/baseline.rs
[[test]]
name = "baseline"
required-features = ["widgets"]

# a store that is not the in-memory one, read by a plot
[[test]]
name = "store"
required-features = ["widgets"]

# a view type of an application, on its own and in the layout of the workbench
[[test]]
name = "own_view"
required-features = ["workbench"]
