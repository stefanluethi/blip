[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blip-outpost"
version = "0.1.0"
description = "Send the traces, logs and actions of your target to blip from a Python script"
readme = "README.md"
license = "MIT"
authors = [{ name = "Stefan Lüthi" }]
requires-python = ">=3.10"
keywords = ["blip", "telemetry", "tracing", "embedded", "websocket", "cbor", "protobuf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=13.0",
    "cbor2>=5.6.0",
    "click>=8.1.0",
    # the schemas of `blip-outpost protobuf`, loaded at run time
    "protobuf>=5.28",
]

[project.urls]
Homepage = "https://stefanluethi.github.io/blip/"
Documentation = "https://stefanluethi.github.io/blip/docs/usage/outpost.html"
Source = "https://github.com/stefanluethi/blip"

[project.scripts]
blip-outpost = "blip_outpost.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blip_outpost"]

[tool.hatch.build.targets.sdist]
include = ["src/blip_outpost", "examples", "tests", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# what the example scripts need beyond the library
examples = [
    "psutil>=5.9.0",
]

[tool.uv]
default-groups = ["dev", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# the tests of the examples import them by module name
pythonpath = ["examples"]
