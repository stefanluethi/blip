[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outpost"
version = "0.1.0"
description = "Connects a target to blip over WebSocket, with user-provided protocols, sockets, simulation and recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "cbor2>=5.6.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
]

[project.scripts]
outpost = "outpost.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outpost"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
