// The schema of the protobuf tests: every annotation of blip/options.proto at least once.

syntax = "proto3";

package test.link;

import "blip/options.proto";

message Up {
  uint32 seq = 1 [(blip.field).role = ROLE_SEQUENCE];
  repeated Item items = 2;
  // no annotation: a trace at "plain"
  uint32 plain = 3;
}

message Item {
  oneof kind {
    Imu imu = 1;
    Image image = 2;
    Battery battery = 3;
    Task task = 4;
    Log log = 5;
    Result result = 6;
    Unannotated raw = 7;
    Axes axes = 8;
  }
}

message Imu {
  option (blip.message) = {path: "imu/acc", record: true};
  uint64 t_first_ns = 1 [(blip.field).role = ROLE_TIMESTAMP];
  uint32 period_ns = 2 [(blip.field).role = ROLE_PERIOD];
  repeated sint32 x = 3 [(blip.field) = {scale: 0.5, unit: "g"}];
  repeated sint32 y = 4 [(blip.field) = {scale: 0.5, unit: "g"}];
}

// series without a record: one trace per field
message Axes {
  option (blip.message) = {path: "axes"};
  uint64 t_us = 1 [(blip.field) = {role: ROLE_TIMESTAMP, scale: 1000}];
  uint32 period_us = 2 [(blip.field) = {role: ROLE_PERIOD, scale: 1000}];
  repeated int32 a = 3;
  repeated int32 b = 4 [(blip.field).name = "beta"];
}

message Image {
  uint64 t_us = 1 [(blip.field) = {role: ROLE_TIMESTAMP, scale: 1000}];
  repeated sint32 mm = 2 [(blip.field) = {path: "tof/distance", unit: "mm", shape: [2, 3], null_below: 0}];
}

enum State {
  STATE_IDLE = 0;
  STATE_CHARGING = 1 [(blip.value).name = "Charging"];
}

message Battery {
  option (blip.message) = {path: "battery"};
  uint64 t_ns = 1 [(blip.field).role = ROLE_TIMESTAMP];
  uint32 voltage_mv = 2 [(blip.field) = {name: "voltage", unit: "V", scale: 0.001}];
  sint32 current_ma = 3 [(blip.field) = {name: "current", unit: "mA"}];
  uint32 internal = 4 [(blip.field).skip = true];
  optional uint32 temperature = 5;
  State state = 6;
}

message Task {
  option (blip.message) = {path: "tasks/{name}", record: true};
  uint64 t_ns = 1 [(blip.field).role = ROLE_TIMESTAMP];
  string name = 2;
  uint32 runtime_bp = 3 [(blip.field) = {name: "runtime", scale: 0.01, unit: "%"}];
  uint32 priority = 4;
}

enum Component {
  COMPONENT_MOTOR = 0;
  COMPONENT_IMU = 1;
}

enum Level {
  LEVEL_TRACE = 0;
  LEVEL_DEBUG = 1;
  LEVEL_INFO = 2;
  LEVEL_WARN = 3;
  LEVEL_ERROR = 4;
  LEVEL_FATAL = 5;
}

message Log {
  option (blip.message).kind = KIND_LOG;
  uint64 t_ns = 1 [(blip.field).role = ROLE_TIMESTAMP];
  Level level = 2 [(blip.field).role = ROLE_LEVEL];
  Component component = 3 [(blip.field).role = ROLE_COMPONENT];
  string text = 4 [(blip.field).role = ROLE_MESSAGE];
}

message Result {
  option (blip.message).kind = KIND_ACTION_RESULT;
  uint32 id = 1 [(blip.field).role = ROLE_ACTION_ID];
  string error = 2 [(blip.field).role = ROLE_ERROR];
}

// no timestamp: the estimated time of the target
message Unannotated {
  uint32 a = 1;
  repeated uint32 b = 2;
}

message Down {
  uint32 seq = 1 [(blip.field).role = ROLE_SEQUENCE];
  oneof kind {
    Invoke invoke = 2;
  }
}

message Invoke {
  option (blip.message).kind = KIND_INVOKE;
  uint32 id = 1 [(blip.field).role = ROLE_ACTION_ID];
  oneof args {
    Speed speed = 2 [(blip.field) = {path: "motor/speed", description: "Speed setpoint", readback: "motor/rpm"}];
    Mode mode = 3 [(blip.field).confirm = true];
    Blob blob = 4;
  }
}

message Speed {
  uint32 rpm = 1 [(blip.field) = {min: 0, max: 3000, unit: "rpm"}];
  float gain = 2 [(blip.field) = {default: 1.5, step: 0.5}];
}

message Mode {
  State state = 1;
  bool on = 2 [(blip.field).default = 1];
  string label = 3;
}

// a repeated parameter: not an action
message Blob {
  repeated uint32 data = 1;
}
