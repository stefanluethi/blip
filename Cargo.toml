[workspace]
resolver = "3"
members = ["blip", "proto"]

[workspace.package]
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
proto = { path = "proto" }
serde = { version = "1.0.219", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 2 # fast and small wasm

# The web build (see blip/index.html): optimized for the size of the wasm.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# not stripped: wasm-opt reads the features of the wasm from a section of it, and
# removes the names itself

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
