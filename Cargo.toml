[workspace]
resolver = "3"
members = ["blip", "proto", "kit"]

[workspace.package]
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2024"
rust-version = "1.88" # let chains
license = "MIT"
repository = "https://github.com/stefanluethi/blip"
homepage = "https://blip.embedded-systems.io/"
# the library crates say `publish = true` themselves, the application is not published
publish = false

[workspace.dependencies]
# the crates use blip-proto under the name `proto`
proto = { package = "blip-proto", path = "proto", version = "0.1.0" }
blip-kit = { path = "kit", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 2 # fast and small wasm
# Release is the only profile built here (see CLAUDE.md), so it is also the one edited
# against: an edit recompiles the changed parts of a workspace crate, not all of it.
# The dependencies are not built incrementally and still come from sccache.
incremental = true

# The web build (see blip/index.html): optimized for the size of the wasm.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
incremental = false
panic = "abort"
# not stripped: wasm-opt reads the features of the wasm from a section of it, and
# removes the names itself

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
