[package]
name = "blip-proto"
description = "Wire protocol between the outpost and blip"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blip-proto"
readme = "README.md"
keywords = ["tracing", "embedded", "protocol", "cbor", "telemetry"]
categories = ["embedded", "encoding"]
publish = true

[dependencies]
serde.workspace = true

[dev-dependencies]
# checks what the senders write against the schema, blip.cddl
cddl-cat = { version = "0.7.1", default-features = false, features = ["ciborium"] }
serde_cbor_2 = "0.13.0"

[lints]
workspace = true
